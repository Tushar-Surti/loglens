[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loglens-common"
version = "1.0.0"
description = "Shared config, schemas, storage and anomaly-detection library for LogLens"
requires-python = ">=3.9"
dependencies = ["pymongo>=4.6", "numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3", "joblib>=1.3"]

[tool.setuptools.packages.find]
include = ["loglens_common*"]
